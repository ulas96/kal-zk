version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
    # errorlint catches the errors.As-versus-type-assertion class of bug — the exact class that
    # produced luima's finding E-01. In an error contract that decides what a client may see,
    # a type assertion that silently never matches is a redaction bypass, not a style issue.
    - errorlint

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # go-pg reads the tableName field by reflection, so every model has an unexported field
      # that is never referenced. It is not dead code; it is the table name.
      - path: (.+)\.go$
        text: 'tableName'
        linters: [unused]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Both, and the order does not matter: goimports does plain string matching, and
      # `github.com/ulas96/kal` is a prefix of `github.com/ulas96/kal-zk`. Listing only kal-zk does
      # NOT work — kal's own imports fall back to the third-party group and `make check`'s gofmt
      # gate then disagrees with your editor. Listing both groups them together in the last block,
      # which is the grouping you want anyway.
      local-prefixes:
        - github.com/ulas96/kal-zk
        - github.com/ulas96/kal

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
